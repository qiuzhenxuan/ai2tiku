name: Hosted deployment images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hosted-images.yml
      - src-tauri/**
      - web/**
      - deploy/**

permissions:
  contents: read

concurrency:
  group: hosted-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file deploy/Dockerfile.api --tag ai2tiku-hosted-api:deploy .
      - name: Build web image
        run: docker build --file deploy/Dockerfile.web --tag ai2tiku-hosted-web:deploy .
      - name: Export deployment images
        run: |
          mkdir -p delivery
          docker save ai2tiku-hosted-api:deploy ai2tiku-hosted-web:deploy | gzip -1 > delivery/ai2tiku-hosted-images.tar.gz
          printf '%s\n' "$GITHUB_SHA" > delivery/commit.txt
          cd delivery
          sha256sum ai2tiku-hosted-images.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ai2tiku-hosted-images
          path: delivery/
          compression-level: 0
          retention-days: 1
