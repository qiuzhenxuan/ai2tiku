name: 编译并发布 Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 只出单文件 exe（前端资源已打进 exe），不做 NSIS/MSI 安装包
      - name: 编译
        run: pnpm tauri build --no-bundle

      - name: 计算校验值
        shell: bash
        run: |
          cd src-tauri/target/release
          sha256sum ai2tiku.exe | tee ai2tiku.exe.sha256

      # 打 tag 时才发 Release；手动触发则只留构建产物
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/ai2tiku.exe
            src-tauri/target/release/ai2tiku.exe.sha256
          generate_release_notes: true

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ai2tiku-windows-x64
          path: |
            src-tauri/target/release/ai2tiku.exe
            src-tauri/target/release/ai2tiku.exe.sha256
