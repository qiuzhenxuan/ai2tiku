name: 编译并发布 Windows 双版本

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows · ${{ matrix.edition }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: native
            cargo_args: ""
          - edition: webview
            cargo_args: "--no-default-features --features webview"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.edition }}

      - name: 安装 pnpm（WebView）
        if: matrix.edition == 'webview'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node（WebView）
        if: matrix.edition == 'webview'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 构建 Vue 界面（WebView）
        if: matrix.edition == 'webview'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib ${{ matrix.cargo_args }}

      - name: 编译 Release
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked ${{ matrix.cargo_args }}

      - name: 整理文件与校验值
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $artifactName = 'ai2tiku-${{ matrix.edition }}-windows-x64.exe'
          $artifactPath = Join-Path release-assets $artifactName
          Copy-Item -LiteralPath src-tauri/target/release/ai2tiku.exe -Destination $artifactPath
          $artifactHash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($artifactPath + '.sha256') -Value ($artifactHash + '  ' + $artifactName) -Encoding ascii

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ai2tiku-${{ matrix.edition }}-windows-x64
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: 发布两个版本
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ai2tiku-*-windows-x64
          path: release-assets
          merge-multiple: true
      - name: 合并并核验校验值
        working-directory: release-assets
        run: |
          cat *.exe.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} · Rust 原生版 / WebView 版
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.exe.sha256
            release-assets/SHA256SUMS.txt
