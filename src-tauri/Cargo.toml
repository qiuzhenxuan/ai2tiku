[package]
name = "ai2tiku"
version = "0.2.3"
description = "AI 驱动的 OCS 题库服务：把大模型接入 OCS 网课助手"
authors = ["ai2tiku"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary to avoid a name conflict with the bin target on Windows.
name = "ai2tiku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["webview"]
native = ["dep:eframe", "dep:image", "dep:dirs", "dep:arboard"]
webview = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager", "dep:tauri-build"]
custom-protocol = ["tauri?/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
tauri-winres = "0.3.6"

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
dirs = { version = "7", optional = true }
arboard = { version = "3.7", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
